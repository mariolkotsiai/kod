[package]
name = "omnimobile-toolkit"
version = "0.1.0"
description = "Dual-device mobile diagnostics, backup, and forensics toolkit"
authors = ["OmniMobile Security Team"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri Core & Serialization
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Low-Level USB & System I/O
rusb = "0.9"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Zero-Trust Cryptography & Memory Safety
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"

# CLI & Standalone TUI (--tui)
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.27"
crossterm = "0.27"

# Structured Error Handling & Logging (Zero unwrap() policy)
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"