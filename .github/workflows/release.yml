name: Release

# Builds the Windows installer for a pushed version tag (v0.1.0, v0.1.0-rc.1, ...) and attaches
# it, with a CycloneDX SBOM and SHA256SUMS, to a DRAFT release. Drafts are only listed for users
# with push access; the release becomes public when the maintainer clicks "Publish release".
# Replaces release-supply-chain.yml (it ran after publishing and never built the installer).
on:
  push:
    tags: ["v*"]

# Least privilege: every job can only read, except draft-release.
permissions:
  contents: read

# One release run per tag at a time; a second run for the same tag waits instead of racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned tool version (crates.io: published 2026-03-19, not yanked; flags checked in
  # cargo-cyclonedx/src/cli.rs at tag cargo-cyclonedx-0.5.9). Bump deliberately.
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # Pinned commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: the next step checks that the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # Fail closed: only commits that are already on main can be released, and the tag must
      # match the version in tauri.conf.json (it names the installer), optionally followed by a
      # pre-release suffix such as -rc.1.
      - name: Check tag
        env:
          # Passed through the environment, never interpolated into the script (injection-safe).
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag '$env:TAG' ($env:GITHUB_SHA) is not on main"
            exit 1
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -cnotmatch "^v$([regex]::Escape($version))(-[0-9A-Za-z.]+)?$") {
            Write-Error "Tag '$env:TAG' does not match version '$version' in tauri.conf.json"
            exit 1
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node
        # Pinned commit SHA for actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
          cargo -V

      # No dependency cache on purpose: a release must not reuse state from other runs.
      - name: Install npm dependencies
        run: npm ci

      # Same command as the local build: beforeBuildCommand (tsc + vite build), the release cargo
      # build and the NSIS bundler (the Tauri CLI downloads NSIS and checks its hash).
      # CI=true on GitHub runners, so the CLI never prompts (--ci).
      - name: Build installer
        run: npm run tauri build

      # Fail closed, like the CI drift check: Cargo.lock, package-lock.json and generated files
      # must not change during the release build.
      - name: Working tree must be clean
        run: |
          $d = git status --porcelain
          if ($d) { Write-Host $d; exit 1 }

      # The bundler names the file after productName ("Kernel Overview and Diagnostics - KOD_...").
      # The release asset gets a name without spaces, so SHA256SUMS lists the exact asset name.
      - name: Collect installer
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*_x64-setup.exe")
          if ($files.Count -ne 1) {
            Write-Error "Expected exactly one NSIS installer, found $($files.Count)"
            exit 1
          }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $dest = "release-artifacts/KOD_$($env:APP_VERSION)_x64-setup.exe"
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest
          Get-FileHash $dest -Algorithm SHA256 | Format-List Hash, Path

      - name: Upload installer
        # Pinned commit SHA for actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer
          path: release-artifacts/
          if-no-files-found: error
          # Short-lived hand-over to the draft-release job, not a distribution channel.
          retention-days: 1

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Pinned commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # cargo downloads the crate with checksum verification; --locked uses its own Cargo.lock.
      - name: Install cargo-cyclonedx
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-cyclonedx --locked --version "${CARGO_CYCLONEDX_VERSION}"

      - name: Generate Cargo SBOM
        run: |
          # --target: the shipped artifact is a Windows build; the host default (Linux) would list
          #   Linux-only crates and omit Windows-only ones. Resolved via cargo metadata, nothing is
          #   compiled.
          # --spec-version 1.5: the tool defaults to 1.3.
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 --target x86_64-pc-windows-msvc --override-filename sbom-cyclonedx
          # Fail closed if the output file name differs from the assumption.
          test -f src-tauri/sbom-cyclonedx.json
          mkdir -p release-artifacts
          mv src-tauri/sbom-cyclonedx.json release-artifacts/

      - name: Upload SBOM
        # Pinned commit SHA for actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: Create draft release
    needs: [build-installer, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only job that can write: it creates the draft release and uploads the assets.
      contents: write
    steps:
      # No checkout: this job never runs repository code while it holds the write token.
      - name: Download artifacts
        # Pinned commit SHA for actions/download-artifact v8.0.2 (fails on a digest mismatch)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: release-artifacts
        run: |
          ls -l
          # Explicit names: exactly the installer and the SBOM.
          sha256sum -- *_x64-setup.exe sbom-cyclonedx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script (injection-safe).
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a suffix (v0.1.0-rc.1) is marked as a pre-release.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # --verify-tag: gh must never create a tag; the pushed tag has to exist already.
          # $prerelease is unquoted on purpose: when empty it adds no argument.
          gh release create "$TAG" \
            release-artifacts/*_x64-setup.exe \
            release-artifacts/sbom-cyclonedx.json \
            release-artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag $prerelease \
            --title "$TAG" \
            --notes "Unsigned build. Check the installer against SHA256SUMS before running it (see README)."