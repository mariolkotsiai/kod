name: CI

on:
  push:
    branches: ["**"]          # τρέχει και στα phase branches πριν ανοίξει PR
  pull_request:
    branches: [main]

permissions:
  contents: read              # ελάχιστα δικαιώματα για το GITHUB_TOKEN

jobs:
  windows-build-test:
    name: Windows build, lint, test
    runs-on: windows-latest   # το target του προϊόντος (x86_64-pc-windows-msvc)
    timeout-minutes: 45       # tauri + rusb vendored: πρώτο build χωρίς cache
    steps:
      - name: Checkout
        # Pinned commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        # Pinned commit SHA for actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"  # ίδιο major με το τοπικό verify (v24.20.0)

      - name: Install Rust toolchain
        # Χωρίς third-party action: rustup υπάρχει ήδη στον runner
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc -V
          cargo -V

      # Το tauri-build/generate_context! χρειάζεται το frontendDist (dist/) για να γίνει compile
      - name: Frontend (npm ci, typecheck, build)
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        # Ίδια flags με το τοπικό gate. --locked: αποτυγχάνει αν το Cargo.lock δεν είναι up to date
        run: cargo clippy --locked --lib --bins --tests -- -D warnings -D clippy::unwrap_used

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Drift check: autogenerated ACL permissions ή lockfiles δεν πρέπει να αλλάζουν στο build
      - name: Working tree must be clean
        run: |
          $d = git status --porcelain
          if ($d) { Write-Host $d; exit 1 }