name: Security and Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual run from the Actions tab ("Run workflow"): full-history secret scan
  # plus a fresh advisory check.
  workflow_dispatch:
  # Weekly run (Mondays 06:00 UTC). Catches newly published RustSec/npm advisories
  # and runs a full-history secret scan even when nobody pushes.
  # Scheduled runs always use the default branch (main).
  schedule:
    - cron: "0 6 * * 1"

# Least-privilege token permissions at workflow level.
permissions:
  contents: read

env:
  # Pinned tool version. Verify/bump on crates.io; never install an unpinned latest in CI.
  CARGO_AUDIT_VERSION: "0.22.2"
  # Docker image the TruffleHog action runs. The action defaults to the mutable "latest" tag,
  # so pinning only the action SHA does not pin the scanner itself.
  # Tag 3.100.0 matches the pinned action (v3.100.0); the digest makes it immutable.
  # The action builds "${image}:${version}", so the value is "<tag>@<digest>".
  # Digest verified on ghcr.io on 2026-11-23.
  TRUFFLEHOG_VERSION: "3.100.0@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b"

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks & TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # pull_request / push: scans the commit range of the event.
      # workflow_dispatch / schedule: no range is passed, so the whole history is scanned.
      - name: Run Gitleaks
        # Pinned commit SHA for gitleaks/gitleaks-action v2.3.9 (verified with git ls-remote)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action picks the commit range from the event itself:
      #   pull_request:                 PR base SHA .. PR head SHA
      #   push:                         previous main tip .. pushed tip
      #   workflow_dispatch / schedule: no range, so the whole history is scanned.
      # Do not set base/head: explicit inputs override that logic. With base "main" and
      # head "HEAD" the PR scan reported 0 chunks / 0 bytes.
      - name: Run TruffleHog OSS
        # Pinned commit SHA for trufflesecurity/trufflehog v3.100.0 (verified with git ls-remote)
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23
        with:
          path: ./
          version: ${{ env.TRUFFLEHOG_VERSION }}
          extra_args: --only-verified

  dependency-audit:
    name: Cargo & NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # cargo audit and npm audit need committed lockfiles: src-tauri/Cargo.lock and package-lock.json.
      - name: Require lockfiles
        run: |
          test -f src-tauri/Cargo.lock || { echo "src-tauri/Cargo.lock is missing"; exit 1; }
          test -f package-lock.json || { echo "package-lock.json is missing"; exit 1; }

      - name: Install Rust toolchain & cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}"

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Setup Node.js
        # Pinned commit SHA for actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"

      - name: Run npm audit
        run: npm audit --audit-level=high
