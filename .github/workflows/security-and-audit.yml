name: Security and Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege token permissions at workflow level.
permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks & TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned commit SHA for actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Pinned commit SHA for gitleaks/gitleaks-action v2.3.8
        uses: gitleaks/gitleaks-action@ffcaaf01bd346b8b062bb90f988c0f0e58a829ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog OSS
        # Pinned commit SHA for trufflesecurity/trufflehog v3.82.6
        uses: trufflesecurity/trufflehog@3804e4f429be5753d7b3879893da7f2d0f6a0f75
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-audit:
    name: Cargo & NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust toolchain & cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Setup Node.js
        # Pinned commit SHA for actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"

      - name: Run npm audit
        run: npm audit --audit-level=high